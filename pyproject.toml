[project]
name = "market-monitor"
version = "0.1.0"
description = "Scheduled market snapshots, emergency alerts, and calendar digests via ntfy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
market-monitor = "market_monitor.cli:main"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
